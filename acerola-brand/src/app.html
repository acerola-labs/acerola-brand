<!doctype html>
<html lang="%paraglide.lang%" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Theme and language shared by every Acerola site (lib/utils/preference.util.ts), applied
			// before the first paint. Theme: the acerola-theme cookie, dark by default. Language: a
			// prefixed path (/pt-br/…, /en/…) saves its locale in acerola-locale; a path with no
			// prefix goes to the cookie's locale (pt-br without one).
			(function () {
				const cookie = (name) => {
					const match = document.cookie.match(
						new RegExp('(?:^|;\\s*)' + name + '=([^;]*)')
					);
					return match ? match[1] : null;
				};

				const theme = cookie('acerola-theme');
				if (theme === 'light' || theme === 'dark')
					document.documentElement.dataset.theme = theme;

				const locales = ['pt-br', 'en'];
				const path = location.pathname;
				const prefix = locales.find(
					(l) => path === '/' + l || path.startsWith('/' + l + '/')
				);
				if (prefix) {
					const shared = /(^|\.)acerola\.app$/.test(location.hostname);
					document.cookie =
						'acerola-locale=' +
						prefix +
						'; path=/; max-age=34560000; samesite=lax' +
						(shared ? '; domain=acerola.app; secure' : '');
				} else {
					const saved = cookie('acerola-locale');
					const locale = locales.includes(saved) ? saved : locales[0];
					location.replace('/' + locale + path + location.search + location.hash);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
