# Acerola standard: weekly PRs on `develop`, grouped, with the message in the project format.
# One block per ecosystem and app folder (npm, cargo, gradle, docker…).
version: 2
updates:
  - package-ecosystem: 'npm' # cargo · gradle · docker
    directory: '/app'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: '[chore](deps)'
    labels:
      - 'dependencies'
      - 'app'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '[chore](ci)'
    labels:
      - 'dependencies'
      - 'github_actions'
    groups:
      actions:
        patterns:
          - '*'
