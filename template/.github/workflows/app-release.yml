# Acerola standard release workflow template. Copy it as <scope>-release.yml and replace "app".
# Runs ONLY on a version tag (vX.Y.Z) made by the release flow (acerola-git): checks that the tag
# is on main and matches the manifest, builds, and creates the GitHub release with the version's
# notes from RELEASE.md. A pre-release tag (v1.2.0-rc.1) does not match and publishes nothing.
name: 'Release/App'

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Republishes an existing tag: pick the tag in "Use workflow from".
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Check, build and publish the release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the next step checks that the tag is on main.
          fetch-depth: 0

      - name: Check the version tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release only runs from a version tag (vX.Y.Z), not from $GITHUB_REF_NAME."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Tags come from the release flow."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME differs from package.json version $version."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: node ../scripts/design/check-design.mjs
      - run: node ../scripts/i18n/check-i18n.mjs
      - run: npm test
      - run: npm run build

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node ../scripts/release/release-notes.mjs "$version" ../RELEASE.md > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Versão $version" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Versão $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
