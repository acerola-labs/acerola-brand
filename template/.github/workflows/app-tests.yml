# Acerola standard test workflow template. Copy it as <scope>-tests.yml, replace "app" with the
# scope and the setup block with the language (Node below; Rust: dtolnay/rust-toolchain + cargo;
# Android: actions/setup-java + gradle).
name: 'Tests/App'

on:
  push:
    branches: [develop, main]
    paths:
      - 'app/**'
      - 'scripts/design/**'
      - '.github/workflows/app-tests.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'app/**'
      - 'scripts/design/**'
      - '.github/workflows/app-tests.yml'
  workflow_dispatch:

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tipos, design e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: node ../scripts/design/check-design.mjs
      - run: node ../scripts/i18n/check-i18n.mjs
      - run: npm test
      - run: npm run build
