# Checks the brand book, publishes the brand files to R2 (cdn.acerola.app) and creates the GitHub
# release. Runs ONLY on a version tag (vX.Y.Z, acerola-git skill) made on main by the release flow;
# a pre-release tag (v1.2.0-rc.1) does not match and publishes nothing. The site itself goes out
# through site-deploy.yml (Komodo), from the same tag.
#
# The job refuses a tag that is not on main or that differs from acerola-brand/package.json.
#
# In the repository (acerola-brand/.env.example lists them):
# - Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (R2 API token with write access).
# - Variables: R2_BUCKET (acerola-cdn), ASSETS_URL (https://cdn.acerola.app) and SITE_URL
#   (https://brand.acerola.app).
name: 'Release/Site'

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Republishes an existing tag: pick the tag in "Use workflow from".
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Check, build and publish the release
    runs-on: ubuntu-latest
    # The app lives in acerola-brand/ (the repository root holds the workflow and the README).
    defaults:
      run:
        working-directory: acerola-brand
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the next step checks that the tag is on main.
          fetch-depth: 0

      - name: Check the version tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release only runs from a version tag (vX.Y.Z), not from $GITHUB_REF_NAME."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Tags come from the release flow."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME differs from package.json version $version."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: acerola-brand/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # The Acerola standard guards (scripts/ lives at the repository root).
      - run: node ../scripts/design/check-design.mjs
      - run: node ../scripts/i18n/check-i18n.mjs

      # Builds the messages (Paraglide), the zips and tokens.json (scripts/kit.mjs) and the static
      # site in build/.
      - name: Build
        env:
          ASSETS_URL: ${{ vars.ASSETS_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      # Only the files go to R2 (brand/ and downloads/); the HTML is served from the hetzner server.
      - name: Upload files to R2
        if: ${{ vars.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the checksums newer AWS CLI versions send by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          aws s3 sync build/brand "s3://$BUCKET/brand" --endpoint-url "$ENDPOINT" --delete \
            --cache-control "public, max-age=3600"
          aws s3 sync build/downloads "s3://$BUCKET/downloads" --endpoint-url "$ENDPOINT" --delete \
            --cache-control "public, max-age=300"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node ../scripts/release/release-notes.mjs "$version" ../RELEASE.md > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Versão $version" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Versão $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
