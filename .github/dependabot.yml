# Acerola standard: weekly PRs on `develop`, grouped, with the message in the project format
# (`[chore](deps): …`) so they pass the commit hook.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/acerola-brand'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: '[chore](deps)'
    labels:
      - 'dependencies'
      - 'site'
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: '[chore](ci)'
    labels:
      - 'dependencies'
      - 'github_actions'
    groups:
      actions:
        patterns:
          - '*'
